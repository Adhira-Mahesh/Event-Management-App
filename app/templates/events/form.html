{% extends "base.html" %}
{% block title %}{{ 'Edit' if mode == 'edit' else 'New' }} Event · CERAS{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-6">{{ 'Edit Event' if mode == 'edit' else 'New Event' }}</h1>

<form method="post" class="bg-white rounded-xl shadow p-6 max-w-2xl space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Event Name</label>
    <input type="text" name="name" value="{{ event.name if event else '' }}"
           class="w-full border rounded-lg px-3 py-2 text-sm" required />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Organizer</label>
    <input type="text" name="organizer" value="{{ event.organizer if event else '' }}"
           class="w-full border rounded-lg px-3 py-2 text-sm" required />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Expected Attendance</label>
    <input type="number" min="0" name="expected_attendance"
           value="{{ event.expected_attendance if event and event.expected_attendance is not none else '' }}"
           class="w-full border rounded-lg px-3 py-2 text-sm" required />
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Start Date/Time</label>
      <input type="datetime-local" name="start_time"
             value="{{ event.start_time.strftime('%Y-%m-%dT%H:%M') if event and event.start_time and event.start_time is not string else '' }}"
             class="w-full border rounded-lg px-3 py-2 text-sm" required />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">End Date/Time</label>
      <input type="datetime-local" name="end_time"
             value="{{ event.end_time.strftime('%Y-%m-%dT%H:%M') if event and event.end_time and event.end_time is not string else '' }}"
             class="w-full border rounded-lg px-3 py-2 text-sm" required />
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Status</label>
    <select name="status" class="w-full border rounded-lg px-3 py-2 text-sm">
      {% for s in statuses %}
        <option value="{{ s }}" {% if event and event.status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="flex gap-3 pt-2">
    <button class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm hover:bg-blue-700">
      {{ 'Save Changes' if mode == 'edit' else 'Create Event' }}
    </button>
    <a href="{{ url_for('events.list_events') }}" class="px-5 py-2 text-sm text-slate-500 hover:underline">Cancel</a>
  </div>
</form>

{% endblock %}
