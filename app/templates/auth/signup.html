{% extends "base.html" %}
{% block title %}Student Organiser Signup · CERAS Portal{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto my-6">
  <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-200/80 p-8 sm:p-10">
    
    <div class="flex items-center gap-3 mb-6">
     
      <div>
        <h2 class="font-display text-2xl font-bold text-slate-900">Organiser Registration</h2>
        <p class="text-xs text-slate-500">Create an account to organise campus events and request shared resources.</p>
      </div>
    </div>



    <form method="post" action="{{ url_for('auth.signup') }}" class="space-y-4">
      
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Full Name</label>
        <input type="text" name="name" value="{{ form_data.name if form_data else '' }}" required autofocus
               placeholder="e.g. Adhira Mahesh"
               class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all bg-slate-50/50 focus:bg-white" />
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">College Email Address</label>
          <input type="email" name="email" value="{{ form_data.email if form_data else '' }}" required
                 placeholder="e.g. name@college.edu.in"
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all bg-slate-50/50 focus:bg-white" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Department / Student Club</label>
          <input type="text" name="department" value="{{ form_data.department if form_data else '' }}" required
                 placeholder="e.g. Computer Society of India/ CSI"
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all bg-slate-50/50 focus:bg-white" />
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Password</label>
          <input type="password" name="password" required minlength="6"
                 placeholder="Minimum 6 characters"
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all bg-slate-50/50 focus:bg-white" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Confirm Password</label>
          <input type="password" name="confirm_password" required minlength="6"
                 placeholder="Repeat password"
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all bg-slate-50/50 focus:bg-white" />
        </div>
      </div>

      <button type="submit" 
              class="w-full mt-4 py-3 px-4 rounded-xl font-semibold text-sm text-white bg-emerald-600 hover:bg-emerald-700 shadow-md shadow-emerald-600/20 hover:shadow-emerald-600/30 transition-all transform active:scale-[0.99] flex items-center justify-center gap-2">
        <span>Create Organiser Account</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>

    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" class="font-semibold text-indigo-600 hover:text-indigo-800 hover:underline ml-1">
        Sign in here →
      </a>
    </div>

  </div>
</div>

{% endblock %}
