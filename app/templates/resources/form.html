{% extends "base.html" %}
{% block title %}{{ 'Edit' if mode == 'edit' else 'New' }} Resource · CERAS{% endblock %}
{% block content %}

<h1 class="text-2xl font-bold mb-6">{{ 'Edit Resource' if mode == 'edit' else 'Add Resource' }}</h1>

<form method="post" class="bg-white rounded-xl shadow p-6 max-w-lg space-y-4">
  <div>
    <label class="block text-sm font-medium mb-1">Name</label>
    <input type="text" name="name" value="{{ resource.name if resource else '' }}"
           placeholder="e.g. Main Auditorium, Mic Unit 3"
           class="w-full border rounded-lg px-3 py-2 text-sm" required />
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Type</label>
    <select name="type" class="w-full border rounded-lg px-3 py-2 text-sm" required>
      <option value="">Select type…</option>
      {% for t in types %}
        <option value="{{ t }}" {% if resource and resource.type == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-sm font-medium mb-1">Capacity <span class="text-slate-400 font-normal">(required for Auditorium / Laboratory)</span></label>
    <input type="number" min="1" name="capacity"
           value="{{ resource.capacity if resource and resource.capacity is not none else '' }}"
           class="w-full border rounded-lg px-3 py-2 text-sm" />
  </div>

  <div class="flex gap-3 pt-2">
    <button class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm hover:bg-blue-700">
      {{ 'Save Changes' if mode == 'edit' else 'Add Resource' }}
    </button>
    <a href="{{ url_for('resources.list_resources') }}" class="px-5 py-2 text-sm text-slate-500 hover:underline">Cancel</a>
  </div>
</form>

{% endblock %}
