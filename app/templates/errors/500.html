{% extends "base.html" %}
{% block title %}Internal Server Error · CERAS{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-16 px-4">
  <div class="w-16 h-16 rounded-3xl bg-rose-100 text-rose-700 flex items-center justify-center text-3xl mx-auto mb-4 shadow-sm">
     
  </div>
  <h1 class="font-display text-3xl font-bold text-slate-900 mb-2">Something went wrong</h1>
  <p class="text-xs text-slate-500 mb-6 leading-relaxed">
    An unexpected error occurred. The system transaction was safely rolled back.
  </p>
  <a href="{{ url_for('dashboard.index') }}" 
     class="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow-md transition-all">
    <span>← Return to Dashboard</span>
  </a>
</div>
{% endblock %}
